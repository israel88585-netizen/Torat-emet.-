<style>
/* Layout: cream search bar over a navy tab bar, parchment page, navy/wine buttons, gold alef. Single light look. */
:root{
  --bg:#efe5d1;--ink:#2a2723;--navy:#1f2e4d;--wine:#6b2737;--gold:#b08d3c;--cream:#faf5ea;--card:#fbf7ee;--surface:#fffdf8;

  --display:"Frank Ruhl Libre","David Libre","David",Georgia,serif;--text:"Assistant","Heebo","Segoe UI",system-ui,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);background-image:linear-gradient(160deg,#f3ead8 0%,#e8dcc4 100%);background-attachment:fixed;color:var(--ink);font:15px/1.55 var(--text)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--cream)}

:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
#topbar{background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:7px max(16px,env(safe-area-inset-left,0px)) 7px max(16px,env(safe-area-inset-right,0px))}
#sform{flex:1;position:relative;min-width:0}
#gq{width:100%;height:38px;border:1.5px solid var(--line-2);border-radius:22px;background:var(--cream);padding:0 14px 0 38px;font:inherit;font-size:14.5px;color:var(--ink)}
#sform button{position:absolute;left:4px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;font-size:17px;color:var(--muted);cursor:pointer}
#gear{flex:none;width:40px;height:40px;border-radius:50%;background:var(--navy);color:var(--cream);display:grid;place-items:center;font-size:20px;text-decoration:none;box-shadow:0 2px 5px rgba(31,46,77,.3)}
#nav{background:var(--navy);display:flex;gap:4px;overflow-x:auto;padding:6px max(8px,env(safe-area-inset-left,0px)) 6px max(8px,env(safe-area-inset-right,0px));scrollbar-width:none;border-bottom:1px solid #16213a}

#nav a.on{background:var(--wine);color:#fff}

main{max-width:900px;margin:0 auto;padding-block:16px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 13px;margin:8px 0;box-shadow:0 1px 2px rgba(60,45,20,.06)}
.art{cursor:pointer}

.meta{color:var(--muted);font-size:13px;margin-top:2px}

.badge{font-size:11.5px;border-radius:20px;padding:1px 9px;white-space:nowrap;border:1px solid}
.badge.no{color:var(--bad);border-color:var(--bad);background:var(--bad-bg)}
.badge.progress{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}

.dategrid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1.2fr) minmax(0,.8fr);gap:6px}

.hero{text-align:center;padding-top:16px}
.alef{font:700 60px/1 var(--display);color:var(--gold)}

.homebtns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:20px 0}
.bigbtn{background:var(--navy);color:var(--cream);text-decoration:none;border-radius:14px;padding:9px 16px;text-align:center;font-size:15px;font-weight:600;min-width:125px;box-shadow:0 3px 8px rgba(31,46,77,.28)}
.bigbtn small{display:block;font-size:11.5px;font-weight:400;opacity:.8;margin-top:2px}
.homelinks{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.warnbox{background:var(--warn-bg);border:1.5px solid var(--warn);border-radius:16px;padding:10px 14px;margin:14px 0}
.trow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}
.trow .n{flex:1;min-width:6rem;cursor:pointer;font-weight:600}
.dsec{margin:12px 0}

.pre{white-space:pre-wrap;overflow-wrap:anywhere}
#toast{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--navy);color:var(--cream);padding:10px 18px;border-radius:14px;max-width:90vw}

a.btn{text-decoration:none;display:inline-block}

.pn{display:flex;justify-content:space-between;gap:8px;margin:2px 0 8px}
#dlg{align-items:center;z-index:70}
.dbox{background:var(--cream);border-radius:18px;padding:18px;width:min(92vw,420px);margin:auto;box-shadow:0 10px 30px rgba(0,0,0,.3)}

.drow{display:flex;gap:8px;margin-top:12px}
main,.sheet{zoom:var(--zoom,1)}
.btn,.seg button,select,input[type=text],input[type=number],input[type=search]{min-height:36px}

/* ===== refinements: narrow centered column, wrapped navigation, manuscript ornament ===== */
#topbar,#nav{padding-left:max(16px,env(safe-area-inset-left,0px),calc((100vw - 600px)/2));padding-right:max(16px,env(safe-area-inset-right,0px),calc((100vw - 600px)/2))}
main{max-width:600px;padding-left:max(26px,6vw,env(safe-area-inset-left,0px));padding-right:max(26px,6vw,env(safe-area-inset-right,0px))}
main>h1{text-align:center;margin:12px 0 16px}
main>h1::after{content:"";display:block;width:150px;height:9px;margin:7px auto 0;background:radial-gradient(circle at center,var(--gold) 0 3px,transparent 3.5px),linear-gradient(var(--gold),var(--gold)) left center/60px 1px no-repeat,linear-gradient(var(--gold),var(--gold)) right center/60px 1px no-repeat}
.card{border-radius:12px;box-shadow:0 1px 3px rgba(60,45,20,.08)}
.tool{justify-items:center;padding:12px 14px;gap:10px}
.tool>input[type=search]{max-width:24rem}
.filters{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%}
.filters select{width:auto;flex:0 1 auto;min-width:7rem;max-width:100%}
.acts{display:flex;justify-content:center}
.btn.pri{padding:8px 26px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.16),0 3px 8px rgba(107,39,55,.25)}
.seg{flex-wrap:wrap;justify-content:center}
.seg button{flex:0 0 auto;padding:5px 18px}
.dz{max-width:24rem;margin:10px auto;font-size:13px;padding:12px}
.tabs,.pstrip{flex-wrap:wrap;overflow:visible;justify-content:center;gap:8px;padding:2px 0 10px}
.tab{border-radius:10px;padding:6px 16px;font-size:15px;font-weight:600}

.stat{text-align:center}
.prog,.bar{max-width:16rem;margin-left:auto;margin-right:auto}
.decl{border:1px solid var(--gold);box-shadow:inset 0 0 0 5px var(--cream),inset 0 0 0 6px var(--line-2),0 2px 8px rgba(60,45,20,.07)}
.bigbtn{box-shadow:inset 0 0 0 1px rgba(176,141,60,.65),0 3px 8px rgba(31,46,77,.25)}
.sheet{max-width:560px}
.brow{display:flex;gap:6px;align-items:center;margin:6px 0}
.brow input{flex:1 1 9rem;min-width:0}
.brow select{flex:0 1 8rem;width:auto;min-width:0}
.chip-x{border:0;background:none;color:var(--bad);font-size:18px;cursor:pointer;padding:4px 8px}
/* advanced PDF viewer */
.pvwrap{position:relative}
.pgs{flex:1;overflow:auto;background:#3b3b3b;padding:8px;position:relative;-webkit-overflow-scrolling:touch}
.pg{position:relative;margin:0 auto 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.pg canvas{display:block}
.pg .mk{position:absolute;inset:0;pointer-events:none}
.markmode .pg .mk{pointer-events:auto;touch-action:none;cursor:crosshair;outline:2px dashed var(--gold);outline-offset:-2px}

</style>

<script>
'use strict';
/* ============ כלים ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const SECTIONS={torah:'התורה',mitzvah:'המצווה',misc:'מאמרים שונים'};
const TY={no:'לא הוקלד',progress:'באמצע הקלדה',yes:'הוקלד'};

/* ============ מסד נתונים ============ */
let db;
const R=r=>new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('torat-emet-v2',1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore('articles',{keyPath:'id'});d.createObjectStore('blobs');d.createObjectStore('kv');};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
const getAll=st=>R(db.transaction(st).objectStore(st).getAll());
const get=(st,k)=>R(db.transaction(st).objectStore(st).get(k));
function W(stores,fn){return new Promise((res,rej)=>{const t=db.transaction(stores,'readwrite');const o=Array.isArray(stores)?stores.map(n=>t.objectStore(n)):t.objectStore(stores);fn(o);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error);});}
const putKV=(k,v)=>W('kv',s=>s.put(v,k));

let A=[],decl='',lastBackup=0,zoom=1;
function applyZoom(){document.documentElement.style.setProperty('--zoom',zoom);}
const DEF_DECL='תורת אמת תהיה לעד — ברוכים הבאים לספרייה האישית שלכם.';

/* ============ גימטריה ותאריך עברי ============ */
const G=[[400,'ת'],[300,'ש'],[200,'ר'],[100,'ק'],[90,'צ'],[80,'פ'],[70,'ע'],[60,'ס'],[50,'נ'],[40,'מ'],[30,'ל'],[20,'כ'],[10,'י'],[9,'ט'],[8,'ח'],[7,'ז'],[6,'ו'],[5,'ה'],[4,'ד'],[3,'ג'],[2,'ב'],[1,'א']];
function gem(n){let s='';for(const [v,l] of G){while(n>=v){s+=l;n-=v;}}return s.replace(/יה$/,'טו').replace(/יו$/,'טז');}
function gz(n){const s=gem(n);return s.length>1?s.slice(0,-1)+'״'+s.slice(-1):s+'׳';}
const leap=y=>((7*y+1)%19)<7;
const MN=['תשרי','חשוון','כסלו','טבת','שבט'],MA=['ניסן','אייר','סיוון','תמוז','אב','אלול'];
const months=y=>leap(y)?[...MN,'אדר א׳','אדר ב׳',...MA]:[...MN,'אדר',...MA];
function hdate(a){if(!a.hy)return'ללא תאריך';let s='';if(a.hd)s+=gz(a.hd)+' ';if(a.hm)s+=(months(a.hy)[a.hm-1]||'')+' ';s+=gz(a.hy%1000);return s+(a.exact?'':' (משוער)');}
function todayHeb(){
  const o={};new Intl.DateTimeFormat('en-u-ca-hebrew',{year:'numeric',month:'long',day:'numeric'}).formatToParts(new Date()).forEach(p=>o[p.type]=p.value);
  const y=parseInt(o.year)||5787;
  const names=leap(y)?['tishri','heshvan','kislev','tevet','shevat','adar i','adar ii','nisan','iyar','sivan','tamuz','av','elul']:['tishri','heshvan','kislev','tevet','shevat','adar','nisan','iyar','sivan','tamuz','av','elul'];
  let mn=String(o.month||'').toLowerCase().replace('tishrei','tishri').replace('cheshvan','heshvan').replace('teves','tevet').replace('shvat','shevat').replace('tammuz','tamuz');
  return{y,m:names.indexOf(mn)+1,d:parseInt(o.day)||0};
}
function hebLong(ts){try{return new Date(ts).toLocaleDateString('he-IL-u-ca-hebrew',{day:'numeric',month:'long',year:'numeric'});}catch(e){return new Date(ts).toLocaleDateString('he-IL');}}

/* ============ תנ"ך, פרשיות ופסוקים ============ */
const CH=['בראשית','שמות','ויקרא','במדבר','דברים'];
const PR=[
[0,'בראשית',1,1],[0,'נח',6,9],[0,'לך לך',12,1],[0,'וירא',18,1],[0,'חיי שרה',23,1],[0,'תולדות',25,19],[0,'ויצא',28,10],[0,'וישלח',32,4],[0,'וישב',37,1],[0,'מקץ',41,1],[0,'ויגש',44,18],[0,'ויחי',47,28],
[1,'שמות',1,1],[1,'וארא',6,2],[1,'בא',10,1],[1,'בשלח',13,17],[1,'יתרו',18,1],[1,'משפטים',21,1],[1,'תרומה',25,1],[1,'תצוה',27,20],[1,'כי תשא',30,11],[1,'ויקהל',35,1],[1,'פקודי',38,21],
[2,'ויקרא',1,1],[2,'צו',6,1],[2,'שמיני',9,1],[2,'תזריע',12,1],[2,'מצורע',14,1],[2,'אחרי מות',16,1],[2,'קדושים',19,1],[2,'אמור',21,1],[2,'בהר',25,1],[2,'בחוקותי',26,3],
[3,'במדבר',1,1],[3,'נשא',4,21],[3,'בהעלותך',8,1],[3,'שלח',13,1],[3,'קרח',16,1],[3,'חקת',19,1],[3,'בלק',22,2],[3,'פינחס',25,10],[3,'מטות',30,2],[3,'מסעי',33,1],
[4,'דברים',1,1],[4,'ואתחנן',3,23],[4,'עקב',7,12],[4,'ראה',11,26],[4,'שפטים',16,18],[4,'כי תצא',21,10],[4,'כי תבוא',26,1],[4,'נצבים',29,9],[4,'וילך',31,1],[4,'האזינו',32,1],[4,'וזאת הברכה',33,1]
].map((p,i)=>({i,ch:p[0],n:p[1],c:p[2],v:p[3]}));
const BOOKS=[['תורה',CH],['נביאים',['יהושע','שופטים','שמואל א','שמואל ב','מלכים א','מלכים ב','ישעיהו','ירמיהו','יחזקאל','הושע','יואל','עמוס','עובדיה','יונה','מיכה','נחום','חבקוק','צפניה','חגי','זכריה','מלאכי']],['כתובים',['תהילים','משלי','איוב','שיר השירים','רות','איכה','קהלת','אסתר','דניאל','עזרא','נחמיה','דברי הימים א','דברי הימים ב']]];
function parashaAt(book,c,v){const b=CH.indexOf(book);if(b<0)return -1;let r=-1;for(const p of PR){if(p.ch!==b)continue;if(c>p.c||(c===p.c&&v>=p.v))r=p.i;}return r;}
function verseParashot(a){const s=new Set();for(const x of a.verses||[]){if(CH.indexOf(x.b)<0)continue;const i1=parashaAt(x.b,x.c,x.v1||1),i2=parashaAt(x.b,x.c,x.v2||x.v1||999);for(let i=Math.max(i1,0);i<=Math.max(i2,i1,0);i++)s.add(i);}return s;}
function vdisp(v){return v.b+' '+gz(v.c)+(v.v1?', '+gz(v.v1)+(v.v2&&v.v2>v.v1?'–'+gz(v.v2):''):'');}
function vtxt(v){return v.b+' '+gem(v.c)+(v.v1?' '+gem(v.v1)+(v.v2&&v.v2>v.v1?' '+gem(v.v2):''):'')+' '+v.c+':'+(v.v1||'');}

/* ============ חיפוש חכם ============ */
const FIN={'ך':'כ','ם':'מ','ן':'נ','ף':'פ','ץ':'צ'};
const nrm=s=>String(s||'').replace(/[\u0591-\u05C7]/g,'').replace(/[ךםןףץ]/g,c=>FIN[c]).replace(/[׳״'"“”„`]/g,'').replace(/[־\-–—,.:;()\[\]\/|]/g,' ').toLowerCase().replace(/\s+/g,' ').trim();
const FL={title:'כותרת',subtitle:'כותרת משנית',tags:'נושאים',mitzvot:'מצוות',discussed:'מה נדון',verses:'פסוקים',typedText:'טקסט מוקלד',parashot:'פרשה',date:'תאריך'};
const HC=new WeakMap();
function hay(a){let h=HC.get(a);if(h)return h;
  h={title:nrm(a.title),subtitle:nrm(a.subtitle),tags:nrm((a.tags||[]).join(' ')),mitzvot:nrm((a.mitzvot||[]).join(' ')),discussed:nrm(a.discussed),verses:nrm((a.verses||[]).map(vtxt).join(' ')),typedText:nrm(a.typedText),parashot:nrm((a.parashot||[]).map(i=>PR[i]?PR[i].n:'').join(' ')),date:nrm(hdate(a))};
  HC.set(a,h);return h;}
function cands(t){const r=[t];if(t.length>3&&'והבלכמש'.includes(t[0])){r.push(t.slice(1));if(t.length>4&&'והבלכמש'.includes(t[1]))r.push(t.slice(2));}return r;}
function tokMatch(h,t){const hp=' '+h+' ';return cands(t).some(x=>x.length<=2?hp.includes(' '+x+' '):h.includes(x));}
function matchA(a,toks){const h=hay(a);const all=Object.values(h).join(' | ');for(const t of toks)if(!tokMatch(all,t))return null;const f=[];for(const k in h)if(toks.some(t=>tokMatch(h[k],t)))f.push(FL[k]);return f;}

const SORTS={dateDesc:'כתיבה: חדש → ישן',dateAsc:'כתיבה: ישן → חדש',upDesc:'הועלה: אחרון קודם',upAsc:'הועלה: ראשון קודם',az:'א → ת',za:'ת → א'};
const dk=a=>a.hy?a.hy*10000+(a.hm||0)*100+(a.hd||0):null;
function sortItems(arr,s){
  const byT=(x,y)=>x.title.localeCompare(y.title,'he');
  const cd=dir=>(x,y)=>{const a=dk(x),b=dk(y);if(a===null&&b===null)return byT(x,y);if(a===null)return 1;if(b===null)return -1;return dir*(a-b)||byT(x,y);};
  const f={dateDesc:cd(-1),dateAsc:cd(1),upDesc:(x,y)=>(y.created||0)-(x.created||0),upAsc:(x,y)=>(x.created||0)-(y.created||0),az:byT,za:(x,y)=>byT(y,x)}[s]||cd(-1);
  return arr.slice().sort(f);
}
const allTags=(f='tags')=>[...new Set(A.flatMap(a=>a[f]||[]))].sort((x,y)=>x.localeCompare(y,'he'));

function bindPanel(){

function refreshList(){
  let items=getBase();

  if(P.tag)items=items.filter(a=>(a.tags||[]).includes(P.tag));
  const toks=nrm(P.q).split(' ').filter(Boolean);
  const hits=new Map();
  if(toks.length){items=items.filter(a=>{const m=matchA(a,toks);if(m)hits.set(a.id,m);return !!m;});}
  items=sortItems(items,P.sort);
  const c=k=>items.filter(a=>a.typed===k).length;
  $('#stat').innerHTML=`${items.length} מאמרים · הוקלדו ${c('yes')} · באמצע ${c('progress')} · לא הוקלדו ${c('no')}${items.length?`<div class="prog"><i style="width:${Math.round(c('yes')/items.length*100)}%"></i></div>`:''}`;
  $('#lst').innerHTML=items.length?items.map(a=>{
    const ex=[];

    if(panelOpts.showParasha&&a.section==='torah')ex.push(esc((a.parashot||[]).map(i=>PR[i]&&PR[i].n).filter(Boolean).join(', ')));

  if(extraFn)$('#extra').innerHTML=extraFn();
}

function msg(t){const m=$('#s_msg');if(m)m.textContent=t;}
function b2d(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(r.error);r.readAsDataURL(b);});}
function dl(blob,name){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000);}
async function exportBackup(withPdf){
  const LIM=90*1048576;const files=[];let cur=[],size=0;
  for(const a of A){
    let pdf=null;
    if(withPdf&&a.hasPdf){const b=await get('blobs',a.id);if(b)pdf=await b2d(b);}
    const s=JSON.stringify(Object.assign({},a,{pdf}));
    if(cur.length&&size+s.length>LIM){files.push(cur);cur=[];size=0;}
    cur.push(s);size+=s.length;msg(`מכין גיבוי… ${files.length*0+A.indexOf(a)+1}/${A.length}`);
  }
  files.push(cur);
  const stamp=new Date().toISOString().slice(0,10);
  for(let i=0;i<files.length;i++){
    const head=`{"app":"torat-emet","version":2,"part":${i+1},"parts":${files.length}`+(i===0?`,"declaration":${JSON.stringify(decl)}`:'')+`,"articles":[`;
    dl(new Blob([head,files[i].join(','),']}'],{type:'application/json'}),`torat-emet-backup-${stamp}${files.length>1?`-${i+1}מתוך${files.length}`:''}.json`);
    await new Promise(r=>setTimeout(r,700));
  }
  lastBackup=Date.now();await putKV('lastBackup',lastBackup);
  msg(`הגיבוי נוצר (${files.length} קבצים). בדוק שהקבצים נשמרו בהורדות.`);
}
async function importFiles(fs){
  if(!fs.length)return;
  if(!(await ask({msg:'השחזור ממזג את הגיבוי לאפליקציה. מאמר קיים עם אותו מזהה יוחלף. להמשיך?',ok:'המשך'})))return;
  let n=0;
  try{
    for(const f of fs){
      msg('קורא '+f.name+'…');
      const d=JSON.parse(await f.text());
      if(d.app!=='torat-emet')throw new Error('הקובץ '+f.name+' אינו גיבוי של האפליקציה');
      if(d.declaration){decl=d.declaration;await putKV('declaration',decl);}
      for(const x of d.articles||[]){
        const pdf=x.pdf;delete x.pdf;
        let blob=null;if(pdf)blob=await (await fetch(pdf)).blob();
        await W(['articles','blobs'],([sa,sb])=>{sa.put(x);if(blob)sb.put(blob,x.id);});
        n++;
      }
    }
    A=await getAll('articles');msg(`שוחזרו ${n} מאמרים.`);
  }catch(e){msg('שגיאה בשחזור: '+e.message);}
}

async function buildPages(){

    p.el.style.width=vp.width+'px';p.el.style.height=vp.height+'px';
    p.task=page.render({canvasContext:p.canvas.getContext('2d'),viewport:page.getViewport({scale:sc*dpr})});await p.task.promise;p.done=true;

  if(!drag)return;const cl=v=>Math.min(1,Math.max(0,v));
  drag.x1=cl((e.clientX-drag.r.left)/drag.r.width);drag.y1=cl((e.clientY-drag.r.top)/drag.r.height);
  Object.assign(drag.box.style,{left:Math.min(drag.x0,drag.x1)*100+'%',top:Math.min(drag.y0,drag.y1)*100+'%',width:Math.abs(drag.x1-drag.x0)*100+'%',height:Math.abs(drag.y1-drag.y0)*100+'%'});
}
async function onPtrUp(){
  if(!drag)return;const d=drag;drag=null;d.box.remove();if(d.x1===undefined)return;
  const L=Math.min(d.x0,d.x1),T=Math.min(d.y0,d.y1),wd=Math.abs(d.x1-d.x0),ht=Math.abs(d.y1-d.y0);
  if(wd<0.02||ht<0.012){toast('הסימון קטן מדי, נסו שוב');return;}
  const a=A.find(x=>x.id===PV.id);
  const label=await ask({msg:'שם לסימון (למשל: "הפירוש על הפסוק"):',input:true,def:'סימון '+(((a&&a.marks)||[]).length+1),ok:'שמירה'});
  if(label===null)return;
  const m={id:uid(),p:+d.pg.dataset.n,x:L,y:T,w:wd,h:ht,label:label.trim()||'סימון',created:Date.now()};
  await updateArticle(PV.id,x=>Object.assign(x,{marks:[...(x.marks||[]),m]}));
  PV.mark=false;setMarkBtn();toast('הסימון נשמר. הוא מוסתר, ונראה רק כשפותחים אותו מהרשימה.');
}
function showMarkList(){
  if(!PV)return;const a=A.find(x=>x.id===PV.id),ms=(a&&a.marks)||[];
  dlg.innerHTML=`<div class="dbox"><p><b>סימונים בקובץ</b></p>${ms.length?ms.map(m=>`<div class="trow"><span class="n" data-act="vgo" data-m="${m.id}">${esc(m.label)} <span class="small">עמ׳ ${m.p}</span></span><button class="btn sm bad" data-act="vdelm" data-m="${m.id}">מחיקה</button></div>`).join(''):'<p class="small">עדיין אין סימונים. לחצו על "✎ סימון" וגררו על אזור בעמוד.</p>'}<div class="drow"><button class="btn" id="dlg_no">סגירה</button></div></div>`;
  dlg.classList.remove('hidden');$('#dlg_no').onclick=()=>{dlg.classList.add('hidden');dlg.innerHTML='';};dlg.onclick=e=>{if(e.target===dlg)$('#dlg_no').click();};
}

/* ============ עורך מאמר ============ */
let E=null;
function openEditor(id,def){
  def=def||{};const a=id?A.find(x=>x.id===id):null;
  E={id:a?a.id:null,file:null,tags:[...(a&&a.tags||[])],mitzvot:[...(a&&a.mitzvot||[])],verses:(a&&a.verses||[]).map(v=>Object.assign({},v)),related:[...(a&&a.related||[])],parashot:new Set(a?a.parashot:(def.parashot||[]))};
  const sec=a?a.section:(def.section||'misc');
  const cy=todayHeb().y,ys=[];for(let y=cy+1;y>=5600;y--)ys.push(y);
  showOv(`<h1 style="margin-top:0">${a?'עריכת מאמר':'מאמר חדש'}</h1>
  <label class="l">קובץ PDF ${a?'(אפשר להשאיר ריק ולא להחליף)':''}</label><input id="f_file" type="file" accept="application/pdf,.pdf"><div class="small" id="f_fname"></div>
  <label class="l">חלק</label><select id="f_sec">${Object.entries(SECTIONS).map(([k,l])=>`<option value="${k}" ${sec===k?'selected':''}>${l}</option>`).join('')}</select>
  <label class="l">כותרת *</label><input id="f_title" type="text" value="${esc(a&&a.title)}">
  <label class="l">כותרת משנית</label><input id="f_sub" type="text" value="${esc(a&&a.subtitle)}">
  <label class="l">תאריך עברי * (לפחות שנה) <button type="button" class="btn sm" data-act="today">היום</button></label>
  <div class="dategrid"><select id="f_hy"><option value="">שנה…</option>${ys.map(y=>`<option value="${y}" ${a&&a.hy===y?'selected':''}>${gz(y%1000)} (${y})</option>`).join('')}</select><select id="f_hm"></select><select id="f_hd"><option value="">יום</option>${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${a&&a.hd===i+1?'selected':''}>${gz(i+1)}</option>`).join('')}</select></div>
  <div class="opts" style="margin-top:6px"><label><input type="radio" name="f_ex" value="1" ${a&&a.exact?'checked':''}>תאריך מדויק</label><label><input type="radio" name="f_ex" value="0" ${!a||!a.exact?'checked':''}>תאריך משוער</label></div>
  <label class="l">מצב הקלדה</label><div class="opts">${Object.entries(TY).map(([k,l])=>`<label><input type="radio" name="f_ty" value="${k}" ${(a?a.typed:'no')===k?'checked':''}>${l}</label>`).join('')}</div>
  <div id="b_torah" class="pl"><label class="l">פרשיות * (אפשר כמה)</label>${CH.map((n,c)=>`<details ${PR.some(p=>p.ch===c&&E.parashot.has(p.i))?'open':''}><summary>${n}</summary>${PR.filter(p=>p.ch===c).map(p=>`<label><input type="checkbox" class="pcb" value="${p.i}" ${E.parashot.has(p.i)?'checked':''}> ${p.n}</label>`).join('')}</details>`).join('')}</div>
  <div id="b_mitzvah"><label class="l">מצוות שהמאמר עוסק בהן</label><div class="chips" id="c_mitzvot"></div><div style="display:flex;gap:6px"><input id="f_mzin" type="text" list="dl_mz" placeholder="כתוב מצווה ולחץ Enter"><button class="btn" type="button" data-act="addMz">הוסף</button></div><datalist id="dl_mz">${allTags('mitzvot').map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>
  <label class="l">נושאים</label><div class="chips" id="c_tags"></div><div style="display:flex;gap:6px"><input id="f_tagin" type="text" list="dl_tags" placeholder="בחר נושא קיים או כתוב חדש ולחץ Enter"><button class="btn" type="button" data-act="addTag">הוסף</button></div><datalist id="dl_tags">${allTags().map(t=>`<option value="${esc(t)}">`).join('')}</datalist>
  <label class="l">פסוקים שהמאמר מפרש</label><div class="chips" id="c_verses"></div>
  <div class="vgrid"><select id="vs_b">${BOOKS.map(([g,bs])=>`<optgroup label="${g}">${bs.map(b=>`<option>${b}</option>`).join('')}</optgroup>`).join('')}</select><input id="vs_c" type="number" min="1" placeholder="פרק"><input id="vs_v1" type="number" min="1" placeholder="מפסוק"><input id="vs_v2" type="number" min="1" placeholder="עד פסוק"><button class="btn" type="button" data-act="addVs">הוסף</button></div>
  <div class="small">פרק בלבד = כל הפרק. מספרים רגילים (3, 5), האפליקציה מציגה באותיות. מספור לפי המקרא העברי.</div>
  <label class="l">מה נדון במאמר (סתירות, שאלות, נושאים וכו׳)</label><textarea id="f_disc">${esc(a&&a.discussed)}</textarea>
  <label class="l">טקסט מוקלד (אפשר להכתיב במיקרופון של המקלדת)</label><textarea id="f_tt" style="min-height:120px">${esc(a&&a.typedText)}</textarea>
  <label class="l">מאמרים קשורים</label><div class="chips" id="c_related"></div><input id="rel_q" type="search" placeholder="חפש מאמר לקישור לפי כותרת"><div id="rel_res" class="chips"></div>
  <p style="display:flex;gap:8px;margin-top:18px"><button class="btn pri" data-act="saveEd">💾 שמירה</button><button class="btn" data-act="cancelEd">ביטול</button></p>`,false);
  fillMonths(a&&a.hm);toggleSec();drawE();
  $('#f_file').onchange=e=>{if(e.target.files[0])setFile(e.target.files[0]);};
  $('#f_sec').onchange=toggleSec;$('#f_hy').onchange=()=>fillMonths($('#f_hm').value);
  $('#rel_q').oninput=relSearch;
}
function toggleSec(){const s=$('#f_sec').value;$('#b_torah').style.display=s==='torah'?'':'none';$('#b_mitzvah').style.display=s==='mitzvah'?'':'none';}
function fillMonths(sel){const y=+$('#f_hy').value||todayHeb().y;sel=+sel||0;$('#f_hm').innerHTML='<option value="">חודש</option>'+months(y).map((m,i)=>`<option value="${i+1}" ${sel===i+1?'selected':''}>${m}</option>`).join('');}
const chip=(t,act,i)=>`<span class="chip">${esc(t)}<button type="button" data-act="${act}" data-i="${i}">×</button></span>`;
function drawE(){
  $('#c_tags').innerHTML=E.tags.map((t,i)=>chip(t,'rmTag',i)).join('');
  $('#c_mitzvot').innerHTML=E.mitzvot.map((t,i)=>chip(t,'rmMz',i)).join('');
  $('#c_verses').innerHTML=E.verses.map((v,i)=>chip(vdisp(v),'rmVs',i)).join('');
  $('#c_related').innerHTML=E.related.map((id,i)=>{const r=A.find(x=>x.id===id);return chip(r?r.title:'(נמחק)','rmRel',i);}).join('');
}
function relSearch(){
  const q=nrm($('#rel_q').value);const box=$('#rel_res');if(!q){box.innerHTML='';return;}
  box.innerHTML=A.filter(a=>a.id!==E.id&&!E.related.includes(a.id)&&nrm(a.title).includes(q)).slice(0,6).map(a=>`<span class="chip link" data-act="addRel" data-id="${a.id}">＋ ${esc(a.title)}</span>`).join('');
}
function addTo(list,inputId){const el=$(inputId);const v=el.value.trim();if(v&&!list.includes(v))list.push(v);el.value='';drawE();}
function addVerse(){
  const b=$('#vs_b').value,c=+$('#vs_c').value,v1=+$('#vs_v1').value||0,v2=+$('#vs_v2').value||0;
  if(!c){toast('כתוב מספר פרק');return;}
  if(v2&&(!v1||v2<v1)){toast('"עד פסוק" חייב להיות אחרי "מפסוק"');return;}
  E.verses.push({b,c,v1,v2});['#vs_c','#vs_v1','#vs_v2'].forEach(s=>$(s).value='');drawE();
}
async function saveEditor(){
  if($('#f_tagin').value.trim())addTo(E.tags,'#f_tagin');
  if($('#f_mzin').value.trim())addTo(E.mitzvot,'#f_mzin');
  const section=$('#f_sec').value,title=$('#f_title').value.trim(),hy=+$('#f_hy').value||0;
  const errs=[];if(!title)errs.push('כותרת');if(!hy)errs.push('שנה');if(!E.id&&!E.file)errs.push('קובץ PDF');if(section==='torah'&&!E.parashot.size)errs.push('פרשה אחת לפחות');
  if(errs.length){toast('חסר: '+errs.join(', '));return;}
  const old=E.id?A.find(x=>x.id===E.id):null;
  let hm=+$('#f_hm').value||0;if(hm>months(hy).length)hm=0;
  const rec={id:E.id||uid(),section,title,subtitle:$('#f_sub').value.trim(),hy,hm,hd:+$('#f_hd').value||0,exact:document.querySelector('input[name=f_ex]:checked').value==='1',typed:document.querySelector('input[name=f_ty]:checked').value,
    parashot:[...E.parashot].sort((x,y)=>x-y),mitzvot:E.mitzvot,tags:E.tags,verses:E.verses,related:E.related,discussed:$('#f_disc').value.trim(),typedText:$('#f_tt').value.trim(),
    created:old?old.created:Date.now(),updated:Date.now(),hasPdf:true,pdfName:E.file?E.file.name:(old&&old.pdfName)||''};
  try{
    await W(['articles','blobs'],([sa,sb])=>{sa.put(rec);if(E.file)sb.put(new Blob([E.file],{type:'application/pdf'}),rec.id);});
  }catch(e){toast('השמירה נכשלה: '+(e&&e.message||e)+'\nייתכן שנגמר המקום באחסון.');return;}
  A=old?A.map(x=>x.id===rec.id?rec:x):[...A,rec];
  closeOv();render();toast(old?'השינויים נשמרו':'המאמר נוסף');
}
async function deleteArticle(id){
  const a=A.find(x=>x.id===id);if(!a||!(await ask({msg:`למחוק את "${a.title}"? אי אפשר לשחזר.`,ok:'מחיקה',danger:true})))return;
  const rel=[];A=A.filter(x=>x.id!==id).map(x=>{if((x.related||[]).includes(id)){const y=Object.assign({},x,{related:x.related.filter(r=>r!==id)});rel.push(y);return y;}return x;});
  await W(['articles','blobs'],([sa,sb])=>{sa.delete(id);sb.delete(id);rel.forEach(y=>sa.put(y));});
  closeOv();render();toast('המאמר נמחק');
}

/* ============ אירועים ============ */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const d=el.dataset,i=+d.i;
  switch(d.act){
    case 'goHash':closeOv(true);location.hash=d.h;break;
    case 'clearF':P.q='';P.typed='';P.tag='';render();break;
    case 'open':showDetails(d.id);break;
    case 'upload':pickFiles(UP||{});break;
    case 'saveBulk':saveBulk();break;
    case 'rmBulk':BK.rows.splice(i,1);if(BK.rows.length)drawBulk();else closeOv();break;
    case 'adv':openAdv(d.id);break;
    case 'openMark':openAdv(d.id,d.m);break;
    case 'vzo':setZoom(PV.zf/1.25);break;
    case 'vzi':setZoom(PV.zf*1.25);break;
    case 'vfit':setZoom(1);break;
    case 'vmark':toggleMark();break;
    case 'vmarks':showMarkList();break;
    case 'vjump':jumpPage();break;
    case 'vgo':{const a=A.find(x=>x.id===PV.id);const m=a&&(a.marks||[]).find(x=>x.id===d.m);const n=$('#dlg_no');if(n)n.click();if(m)showMark(m);break;}
    case 'vdelm':{if(await ask({msg:'למחוק את הסימון?',ok:'מחיקה',danger:true}))await updateArticle(PV.id,a=>Object.assign(a,{marks:(a.marks||[]).filter(x=>x.id!==d.m)}));showMarkList();break;}
    case 'edit':openEditor(d.id);break;
    case 'del':deleteArticle(d.id);break;
    case 'pdf':openPdf(d.id);break;
    case 'closeOv':closeOv();break;
    case 'closePv':closePv();break;
    case 'cancelEd':if(await ask({msg:'לבטל את השינויים?',ok:'כן, לבטל',cancel:'להמשיך לערוך',danger:true}))closeOv();break;
    case 'saveEd':saveEditor();break;
    case 'setTyped':{const a=A.find(x=>x.id===d.id);const b=Object.assign({},a,{typed:d.v,updated:Date.now()});await W('articles',s=>s.put(b));A=A.map(x=>x.id===b.id?b:x);showDetails(b.id);render();break;}
    case 'scope':P.scope=d.v;document.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.v===d.v));refreshList();break;
    case 'topicOpen':{closeOv(true);P=newP();if(d.f==='tags'){P.tag=d.n;}else{P.q=d.n;}keepP=true;location.hash==='#search'?render():(location.hash='#search');break;}
    case 'topicRen':{const nn=((await ask({msg:'שם חדש:',input:true,def:d.n,ok:'שמירה'}))||'').trim();if(!nn||nn===d.n)break;if(A.some(a=>(a[d.f]||[]).includes(nn))&&!(await ask({msg:`"${nn}" כבר קיים. למזג את שניהם?`,ok:'מיזוג'})))break;await topicChange(d.f,d.n,nn);break;}
    case 'topicDel':if(await ask({msg:`להסיר את "${d.n}" מכל המאמרים? המאמרים עצמם לא יימחקו.`,ok:'הסרה',danger:true}))await topicChange(d.f,d.n,'');break;
    case 'saveDecl':decl=$('#s_decl').value;await putKV('declaration',decl);toast('נשמר');break;
    case 'exportAll':exportBackup(true);break;
    case 'exportMeta':exportBackup(false);break;
    case 'today':{const t=todayHeb();$('#f_hy').value=t.y;fillMonths(t.m);$('#f_hd').value=t.d||'';break;}
    case 'addTag':addTo(E.tags,'#f_tagin');break;
    case 'addMz':addTo(E.mitzvot,'#f_mzin');break;
    case 'addVs':addVerse();break;
    case 'rmTag':E.tags.splice(i,1);drawE();break;
    case 'rmMz':E.mitzvot.splice(i,1);drawE();break;
    case 'rmVs':E.verses.splice(i,1);drawE();break;
    case 'rmRel':E.related.splice(i,1);drawE();break;
    case 'addRel':E.related.push(d.id);$('#rel_q').value='';$('#rel_res').innerHTML='';drawE();break;
  }
});
document.addEventListener('change',e=>{if(E&&e.target.classList.contains('pcb')){const v=+e.target.value;e.target.checked?E.parashot.add(v):E.parashot.delete(v);}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if(!dlg.classList.contains('hidden')){const n=$('#dlg_no');if(n)n.click();}
    else if(!pv.classList.contains('hidden'))closePv();
    else if(!ov.classList.contains('hidden')&&!E)closeOv();
    return;
  }
  if(e.key!=='Enter'&&e.key!==',')return;
  if(e.target.id==='f_tagin'){e.preventDefault();addTo(E.tags,'#f_tagin');}
  else if(e.target.id==='f_mzin'){e.preventDefault();addTo(E.mitzvot,'#f_mzin');}
});

window.addEventListener('popstate',()=>{
  if(selfPop>0){selfPop--;return;}
  if(!dlg.classList.contains('hidden')){const n=$('#dlg_no');if(n)n.click();if(!pv.classList.contains('hidden'))pvP=pushH();else if(!ov.classList.contains('hidden'))ovP=pushH();return;}
  if(!pv.classList.contains('hidden')){pvP=false;closePv(true);return;}
  if(!ov.classList.contains('hidden')){
    if(E){ovP=pushH();ask({msg:'לבטל את השינויים?',ok:'כן, לבטל',cancel:'להמשיך לערוך',danger:true}).then(y=>{if(y)closeOv();});}
    else{ovP=false;closeOv(true);}
  }
});
$('#sform').addEventListener('submit',e=>{e.preventDefault();const g=$('#gq');P=newP();P.q=g.value;g.value='';g.blur();keepP=true;if(location.hash==='#search')render();else location.hash='#search';});
/* ============ התחלה ============ */
(async function init(){
  try{
    db=await openDB();A=await getAll('articles');
    decl=(await get('kv','declaration'))||DEF_DECL;lastBackup=(await get('kv','lastBackup'))||0;zoom=(await get('kv','zoom'))||1;applyZoom();
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){main.innerHTML='<div class="card">לא ניתן לפתוח את אחסון הדפדפן: '+esc(e&&e.message)+'<br>ייתכן שהדפדפן במצב גלישה פרטית.</div>';return;}
  window.addEventListener('hashchange',render);render();
})();
</script>
